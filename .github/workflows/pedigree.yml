name: 血統の取り込み
on:
  workflow_dispatch:
  schedule:
    - cron: "41 0-20/3 * * 1-5"   # 平日（日本時間の月〜金）、3時間ごと。土日の取得と重ならないように
permissions:
  contents: write
concurrency:
  group: pedigree
  cancel-in-progress: false
jobs:
  pedigree:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: data ブランチ
        run: |
          git clone -q --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data
          git -C data config user.name "keiyomi-bot"; git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: scraper/requirements.txt }
      - run: pip install -r scraper/requirements.txt
      - name: 取り込み
        env:
          APP_PASS: ${{ secrets.APP_PASS }}
        run: |
          python scraper/pedigree.py --data data --minutes 45
          git -C data add -A
          git -C data diff --cached --quiet && exit 0
          git -C data commit -q -m "血統 $(TZ=Asia/Tokyo date '+%m/%d %H:%M')"
          for k in 1 2 3 4; do git -C data push -q origin data && exit 0; git -C data pull -q --rebase -X theirs origin data; done
