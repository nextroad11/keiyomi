name: 前日の予想
# 毎日の夜（日本時間 18:40・20:10・21:40）に、翌日が開催日なら出馬表と前日発売のオッズを取り、翌日の予想を先に出す。
# 前日のオッズでの予想は「早めに見る」ためだけ。買い目の確定は当日の締切5分前のまま。
on:
  push:
    branches: [main]
    paths: [".github/workflows/preview.yml"]
  schedule:
    - cron: "40 9 * * *"
    - cron: "10 11 * * *"
    - cron: "40 12 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: data・odds ブランチ
        run: |
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git clone -q --depth 1 --branch data "$url" data
          git clone -q --depth 1 --branch odds "$url" odds
          for d in data odds; do git -C $d config user.name "keiyomi-bot"; git -C $d config user.email "41898282+github-actions[bot]@users.noreply.github.com"; done
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: scraper/requirements.txt }
      - run: pip install -r scraper/requirements.txt -r model/requirements.txt
      - name: 翌日の出馬表と前日発売のオッズ → 翌日の予想
        env:
          APP_PASS: ${{ secrets.APP_PASS }}
        run: |
          set +e
          rm -f /tmp/daily_done
          for i in $(seq 1 12); do
            python scraper/daily.py --preview --data data --odds odds --done-flag /tmp/daily_done || echo "この回は失敗"
            [ -f /tmp/daily_done ] && exit 0   # 翌日は開催なし
            sleep 10
          done
          tomorrow=$(TZ=Asia/Tokyo date -d tomorrow +%Y%m%d)
          python model/predict.py --data data --odds odds --date "$tomorrow" || echo "予想の計算に失敗"
          for d in data odds; do
            git -C $d add -A
            git -C $d diff --cached --quiet && continue
            git -C $d commit -q -m "前日の予想 $(TZ=Asia/Tokyo date '+%m/%d %H:%M')"
            b=$(git -C $d branch --show-current)
            for k in 1 2 3 4; do git -C $d push -q origin "$b" && break; git -C $d pull -q --rebase origin "$b"; done
          done
