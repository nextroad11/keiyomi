name: 地方競馬の取り込み
# 地方競馬全国協会の公式配布データ（結果・払戻・確定オッズ）を、毎日1回取り込む（前月と今月は取り直し）。
# 置き場は nar ブランチ（暗号化）。
on:
  schedule:
    - cron: "41 17 * * *"   # 毎日 2:41（日本時間。配布ファイルは2時ごろ更新）
  push:
    branches: [main]
    paths: ["scraper/nar.py", ".github/workflows/nar.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nar
jobs:
  nar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: nar ブランチ
        run: |
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          if git ls-remote --exit-code --heads origin nar >/dev/null; then
            git clone -q --depth 1 --branch nar "$url" nar
          else
            mkdir nar && git -C nar init -q -b nar && git -C nar remote add origin "$url"
            echo "# nar ブランチ（地方競馬の公式配布データ、暗号化）" > nar/README.md
          fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: scraper/requirements.txt }
      - run: pip install -r scraper/requirements.txt
      - name: 取り込み
        env:
          APP_PASS: ${{ secrets.APP_PASS }}
        run: python scraper/nar.py --out nar --from 2017-01 --minutes 45
      - name: 保存
        if: always()
        working-directory: nar
        run: |
          git config user.name "keiyomi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "地方競馬の取り込み $(TZ=Asia/Tokyo date '+%m/%d')"
          for i in 1 2 3 4; do git push -q -u origin nar && exit 0; git pull -q --rebase origin nar; done
          exit 1
