name: 結果の取り直し（一回きり）
on:
  workflow_dispatch:
    inputs:
      dates:
        description: "日付（空白区切り）"
        default: "20261115 20261121 20261122 20261123"
permissions:
  contents: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: data・odds ブランチ
        run: |
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git clone -q --depth 1 --branch data "$url" data
          git clone -q --depth 1 --branch odds "$url" odds
          for d in data odds; do git -C $d config user.name "keiyomi-bot"; git -C $d config user.email "41898282+github-actions[bot]@users.noreply.github.com"; done
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: scraper/requirements.txt }
      - run: pip install -r scraper/requirements.txt -r model/requirements.txt
      - name: 取り直して、予想の採点もやり直す
        env:
          APP_PASS: ${{ secrets.APP_PASS }}
        run: |
          python scraper/repair_results.py --data data --odds odds ${{ github.event.inputs.dates }}
          for d in ${{ github.event.inputs.dates }}; do python model/predict.py --data data --odds odds --date $d --redo-ref || echo "予想の計算に失敗 $d"; done
          for d in data odds; do
            git -C $d add -A
            git -C $d diff --cached --quiet && continue
            git -C $d commit -q -m "結果の取り直し（速報の5頭だけだった分）"
            b=$(git -C $d branch --show-current)
            for k in 1 2 3 4; do git -C $d push -q origin "$b" && break; git -C $d pull -q --rebase -X theirs origin "$b"; done
          done
