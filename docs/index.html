<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>競読みAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Oswald:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 競馬新聞の紙面：印と的中は朱、芝の緑はアクセント。スマホ1列、上部に横スクロールのタブ */
:root{
  --paper:#eef0eb; --sheet:#fbfcf9; --ink:#14181a; --muted:#646b66; --rule:#cfd5cd;
  --shu:#d2261b; --turf:#1d6a3f; --turf-soft:#dcebe0; --gold:#a8790c; --on:#fff;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --num:"Oswald","Zen Kaku Gothic New",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0e1310; --sheet:#161d19; --ink:#e7ece5; --muted:#99a39b; --rule:#2c362f;
  --shu:#ff5d4e; --turf:#5ccb8b; --turf-soft:#1c3326; --gold:#e3b33d; --on:#0e1310; color-scheme:dark;}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.app{max-width:760px;margin:0 auto;padding:0 16px 40px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 0 8px}
.brand{font-family:var(--display);font-size:22px;line-height:1.1}
.brand small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);letter-spacing:.06em;margin-top:3px}
.sync{font-size:11px;color:var(--muted);text-align:right}
nav{position:sticky;top:0;z-index:5;background:var(--paper);border-top:3px double var(--ink);border-bottom:1px solid var(--rule);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 12px}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:none;background:none;padding:10px 11px 8px;cursor:pointer;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--shu);border-bottom-color:var(--shu);font-weight:700}
.view{display:none;padding-top:14px}
.view.on{display:grid;gap:12px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:14px;min-width:0}
.card h2{font-family:var(--display);font-weight:400;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.sub{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:400}
.muted{color:var(--muted)} .small{font-size:12px}
.note{font-size:11.5px;color:var(--muted);line-height:1.6;margin:0}
.banner{border:1px solid var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--sheet));border-radius:6px;padding:10px 12px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11.5px;border:1px solid var(--rule);border-radius:99px;padding:0 8px;background:var(--paper);white-space:nowrap}
.chip.gold{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
.chip.shu{background:var(--shu);border-color:var(--shu);color:#fff;font-weight:700}
.chip.turf{background:var(--turf-soft);border-color:transparent;color:var(--turf);font-weight:700}
.na{color:var(--muted);font-size:11px;border:1px dashed var(--rule);border-radius:3px;padding:0 4px;white-space:nowrap}
.btn{border:1px solid var(--ink);background:var(--sheet);border-radius:4px;padding:8px 14px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--turf);border-color:var(--turf);color:var(--on)}
.btn:focus-visible,input:focus,select:focus,.race:focus-visible{outline:2px solid var(--turf);outline-offset:2px}
input,select{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:9px 10px;width:100%}
/* レース一覧 */
.venue{font-family:var(--display);font-size:15px;margin:6px 0 -4px}
.race{display:grid;grid-template-columns:52px 1fr auto;gap:2px 10px;align-items:center;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;cursor:pointer}
.race:hover{border-color:var(--ink)}
.race .t{font-family:var(--num);font-size:19px;font-weight:600;line-height:1}
.race .r{font-size:11px;color:var(--muted)}
.race .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.race .meta{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap}
.race.done{opacity:.72}
.race .st{justify-self:end}
/* 出走馬 */
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 5px;border-top:1px solid var(--rule);font-size:13.5px;vertical-align:middle}
th{font-size:11px;color:var(--muted);font-weight:500;border-top:none;white-space:nowrap}
td.r,th.r{text-align:right}
.waku{display:inline-grid;place-items:center;width:24px;height:24px;font-family:var(--num);font-weight:600;font-size:13px;border-radius:3px;border:1px solid #0003}
.w1{background:#fff;color:#111}.w2{background:#111;color:#fff}.w3{background:#d8261c;color:#fff}.w4{background:#1f5fbf;color:#fff}
.w5{background:#f2d21b;color:#111}.w6{background:#1f8a43;color:#fff}.w7{background:#f08a1c;color:#111}.w8{background:#f28bb0;color:#111}
.mark{color:var(--shu);font-weight:700;font-size:18px;text-align:center;width:22px}
.hn{font-weight:700;white-space:nowrap}
.bar{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin-top:3px;min-width:44px}
.bar i{display:block;height:100%;background:var(--turf)}
.up{color:var(--turf);font-weight:700}
.combo{font-family:var(--num);font-size:16px;font-weight:600;white-space:nowrap}
.hit{background:color-mix(in srgb,var(--shu) 14%,transparent)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:12px}
.tile .k{font-size:11.5px;color:var(--muted)}
.tile .v{font-family:var(--num);font-size:28px;font-weight:600;line-height:1.15}
.tile .v small{font-size:13px;color:var(--muted);font-weight:500}
.pos{color:var(--turf)} .neg{color:var(--shu)}
svg text{fill:var(--muted);font-family:var(--num);font-size:11px}
/* 合言葉 */
#lock{min-height:80vh;display:grid;place-items:center}
#lock .card{max-width:360px;width:100%;display:grid;gap:10px}
.err{color:var(--shu);font-size:13px;min-height:1.2em}
/* iPhone のパスワード欄は日本語を打てないので、普通の欄を伏せ字で表示する */
.secret{-webkit-text-security:disc;text-security:disc}
.secret.show{-webkit-text-security:none;text-security:none}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">競読みAI<small>JRA公式データ × AI ／ 3連複・3連単</small></div>
    <div class="sync" id="sync"></div>
  </header>

  <section id="lock">
    <form class="card" id="lockf">
      <h2>合言葉を入れてください</h2>
      <p class="note">データは合言葉で暗号化してあります。この端末には合言葉ではなく鍵だけを保存します。</p>
      <input id="lockpw" type="text" class="secret" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="合言葉（日本語も入力できます）" aria-label="合言葉">
      <label class="small row" style="gap:6px;cursor:pointer"><input type="checkbox" id="showpw" style="width:auto"> 合言葉を表示する</label>
      <button class="btn primary" id="lockbtn" type="submit">開く</button>
      <div class="err" id="lockerr" role="alert"></div>
    </form>
  </section>

  <div id="main" hidden>
    <nav id="tabs" aria-label="画面切替">
      <button data-tab="today" class="on">レース一覧</button>
      <button data-tab="race">レース</button>
      <button data-tab="record">記録の成績</button>
      <button data-tab="about">しくみ</button>
    </nav>
    <section class="view on" id="v-today"></section>
    <section class="view" id="v-race"></section>
    <section class="view" id="v-record"></section>
    <section class="view" id="v-about"></section>
  </div>
</div>

<script>
(() => {
"use strict";
const DATA = "https://raw.githubusercontent.com/nextroad11/keiyomi/data/enc/";
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (x,d=0) => x==null||!isFinite(x) ? "—" : (x*100).toFixed(d)+"%";
const yen = n => (n<0?"−":"")+"¥"+Math.abs(Math.round(n||0)).toLocaleString("ja-JP");
const NA = '<span class="na">取得不可</span>';
const LS = { get(k,d){ try{ const v=localStorage.getItem("keiyomi:"+k); return v==null?d:JSON.parse(v);}catch(_){return d;} },
             set(k,v){ try{ localStorage.setItem("keiyomi:"+k, JSON.stringify(v)); }catch(_){} },
             del(k){ try{ localStorage.removeItem("keiyomi:"+k);}catch(_){} } };
const ub64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));

/* ---------- 暗号（scraper/crypt.py と同じ：PBKDF2-SHA256 31万回 → AES-256-GCM） ---------- */
let KEY = null;
async function deriveKey(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt:new TextEncoder().encode("keiyomi-v1"), iterations:310000},
    base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function fetchEnc(path, key){
  const r = await fetch(DATA + path + "?t=" + Math.floor(Date.now()/60000), {cache:"no-store"});
  if(r.status===404) return null;
  if(!r.ok) throw new Error("取得できません（"+r.status+"）");
  const box = await r.json();
  let pt = new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv:ub64(box.iv)}, key||KEY, ub64(box.ct)));
  if(pt[0]===0x1f && pt[1]===0x8b){ pt = new Uint8Array(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer()); }
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------- 状態 ---------- */
let MODEL=null, INDEX=null, PRED=null, REC=null, DATE=null, RID=null, tab="today", timer=null;
function todayJST(){ const d=new Date(Date.now()+9*3600e3); return d.toISOString().slice(0,10).replace(/-/g,""); }
const fmtDate = d => d ? `${+d.slice(4,6)}/${+d.slice(6,8)}` : "";
const wd = d => "日月火水木金土"[new Date(+d.slice(0,4), +d.slice(4,6)-1, +d.slice(6,8)).getDay()];

async function unlock(){
  try{
    const raw = LS.get("k", null);
    if(raw){ const k = await crypto.subtle.importKey("raw", ub64(raw), {name:"AES-GCM"}, true, ["decrypt"]); MODEL = await fetchEnc("model.json", k); KEY = k; return start(); }
  }catch(_){ LS.del("k"); }
  $("#lock").hidden = false;
}
$("#showpw").addEventListener("change", e => $("#lockpw").classList.toggle("show", e.target.checked));
$("#lockf").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = $("#lockpw").value.trim().normalize("NFKC"); if(!pw) return;
  $("#lockbtn").disabled = true; $("#lockbtn").innerHTML = '<span class="spin"></span>確認中'; $("#lockerr").textContent = "";
  try{
    const k = await deriveKey(pw); MODEL = await fetchEnc("model.json", k); KEY = k;
    LS.set("k", b64(await crypto.subtle.exportKey("raw", k))); start();
  }catch(err){
    $("#lockerr").textContent = err && err.name==="OperationError" ? "合言葉が違います" : ("開けませんでした：" + (err.message||err));
  }
  $("#lockbtn").disabled = false; $("#lockbtn").textContent = "開く";
});

async function start(){
  $("#lock").hidden = true; $("#main").hidden = false;
  await load(true);
  clearInterval(timer); timer = setInterval(() => { if(DATE===todayJST() && document.visibilityState==="visible") load(false); }, 60000);
}
async function load(first){
  try{
    INDEX = await fetchEnc("pred/index.json") || {dates:[]};
    if(first){ DATE = INDEX.dates.includes(todayJST()) ? todayJST() : INDEX.dates[INDEX.dates.length-1] || null; }
    PRED = DATE ? await fetchEnc(`pred/${DATE}.json`) : null;
    REC = await fetchEnc("paper/records.json") || {races:{}};
    $("#sync").innerHTML = `更新 ${new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}<br>モデル ${esc(MODEL?.version||"")}`;
  }catch(err){ $("#sync").textContent = "読み込みに失敗：" + (err.message||err); }
  render();
}

/* ---------- 共通 ---------- */
function wakuOf(no, n){ if(n<=8) return no; const base=Math.floor(n/8), extra=n%8; let s=1;
  for(let w=1; w<=8; w++){ const c=base+(w>8-extra?1:0); if(no<s+c) return w; s+=c; } return 8; }
const W = (no,n,w) => `<span class="waku w${w||wakuOf(no,n)}">${esc(no)}</span>`;
function status(p){
  if(p.result){
    const t=p.result, ret=(t.trio?.ret||0)+(t.tri?.ret||0);
    if(t.no_paper){ const rr=p.ref?.result; const rret=(rr?.trio?.ret||0)+(rr?.tri?.ret||0); return rret>0?'<span class="chip">参考で的中</span>':'<span class="chip">記録なし</span>'; }
    if(ret>0) return `<span class="chip shu">記録的中</span>`;
    return '<span class="chip">結果</span>';
  }
  if(p.paper) return '<span class="chip turf">記録済み</span>';
  return '<span class="chip">発走前</span>';
}
function minsLabel(m){ return m==null ? "" : (m<=1.2 ? "1分前" : Math.round(m)+"分前"); }

/* ---------- レース一覧 ---------- */
function renderToday(){
  const el = $("#v-today");
  const dates = (INDEX?.dates||[]).slice().reverse();
  const sel = `<select id="dateSel" aria-label="開催日">${dates.map(d=>`<option value="${d}" ${d===DATE?"selected":""}>${fmtDate(d)}（${wd(d)}）${d===todayJST()?" 今日":""}</option>`).join("")}</select>`;
  if(!PRED){ el.innerHTML = `<div class="card"><h2>レース一覧</h2>${dates.length?sel:""}<p class="muted" style="margin:8px 0 0">${dates.length?"この日の予想はまだありません。":"まだ予想がありません。次の開催日の朝から出ます。"}</p></div>`; bindDate(); return; }
  const races = Object.values(PRED.races).sort((a,b)=>(a.post||"").localeCompare(b.post||""));
  const nTrio = races.filter(r=>(r.trio||[]).length).length;
  let html = `<div class="banner">まだ賭けない期間です。買い目は<b>記録用</b>で、締切5分前のオッズで固定して実際の払戻で採点しています。</div>
  <div class="card"><div class="row" style="justify-content:space-between"><div style="flex:1;min-width:140px">${sel}</div>
    <div class="small muted">${races.length}レース・3連複の候補あり ${nTrio}R${races.some(r=>r.result)?`・結果 ${races.filter(r=>r.result).length}R・記録 ${races.filter(r=>r.paper).length}R`:""}</div></div></div>`;
  const byV = {}; races.forEach(r => (byV[r.venue] = byV[r.venue] || []).push(r));
  html += `<div style="display:grid;gap:8px">` + races.map(r => {
    const nT=(r.trio||[]).length, nX=(r.tri||[]).length, done=!!r.result;
    return `<button class="race${done?" done":""}" data-rid="${esc(r.rid)}">
      <div><div class="t">${esc(r.post||"--:--")}</div><div class="r">${esc(r.venue||"")}${esc(r.rno||"")}R</div></div>
      <div class="nm">${esc(r.name||"")} <span class="small muted">${esc(r.surface||"")}${r.distance?esc(r.distance)+"m":""}</span></div>
      <div class="st">${status(r)}</div>
      <div class="meta">
        ${nT?`<span class="chip gold">3連複 ${nT}点</span>`:`<span class="chip">3連複 候補なし</span>`}
        ${nX?`<span class="chip">3連単 ${nX}点（検証中）</span>`:""}
        ${r.man!=null?`<span class="chip">万馬券 ${pct(r.man)}</span>`:""}
        ${r.favout!=null?`<span class="chip">1番人気が飛ぶ ${pct(r.favout)}</span>`:""}
        ${r.odds_mins!=null && !done?`<span class="chip">${minsLabel(r.odds_mins)}のオッズ</span>`:""}
      </div></button>`; }).join("") + `</div>`;
  el.innerHTML = html; bindDate();
}
function bindDate(){ const s=$("#dateSel"); if(s) s.onchange = async () => { DATE=s.value; RID=null; PRED = await fetchEnc(`pred/${DATE}.json`); render(); }; }

/* ---------- レース ---------- */
function refBlock(ref){
  const r=ref.result||{}, T=r.trio||{}, X=r.tri||{};
  return `<div style="margin-top:8px;border-top:1px dashed var(--rule);padding-top:8px">
    <div class="small"><b>参考：確定オッズで計算した買い目</b>（実際には選べなかったので、記録の成績には入れません）</div>
    <div class="small" style="margin-top:4px">3連複 ${T.pts||0}点${(ref.trio||[]).length?"（"+ref.trio.map(x=>esc(x.c)).join("、")+"）":""} → ${T.ret?'<b class="neg">的中 '+yen(T.ret)+'</b>':"不的中"}</div>
    <div class="small">3連単 ${X.pts||0}点 → ${X.ret?'<b class="neg">的中 '+yen(X.ret)+'</b>':"不的中"}</div></div>`;
}
function comboTable(list, kind, hitKey){
  if(!list || !list.length) return "";
  return `<div class="tw"><table><thead><tr><th>買い目</th><th class="r">AI確率</th><th class="r">オッズ</th><th class="r">期待値</th></tr></thead><tbody>
    ${list.map(x=>`<tr class="${hitKey && x.c.replace(/→/g,"-")===hitKey?"hit":""}"><td class="combo">${esc(x.c)}</td><td class="r num">${pct(x.p,kind==="tri"?2:1)}</td><td class="r num">${x.o?x.o.toFixed(1)+"倍":NA}</td><td class="r num">${x.ev!=null?x.ev.toFixed(2):"—"}</td></tr>`).join("")}
  </tbody></table></div>`;
}
function renderRace(){
  const el = $("#v-race");
  const p = PRED && RID ? PRED.races[RID] : null;
  if(!p){ el.innerHTML = `<div class="card"><h2>レース</h2><p class="muted" style="margin:0">「レース一覧」からレースを選んでください。</p></div>`; return; }
  const n = p.n || (p.horses||[]).length, res = p.result;
  const top3 = res?.top3 || [];
  const hk = top3.length===3 ? [...top3].sort((a,b)=>a-b).join("-") : null, hkt = top3.length===3 ? top3.join("-") : null;
  const horses = (p.horses||[]).slice().sort((a,b)=>a.no-b.no);
  let html = `<div class="card">
    <div class="small muted">${fmtDate(PRED.date)}（${wd(PRED.date)}） ${esc(p.venue||"")} ${esc(p.rno||"")}R ・ 発走 ${esc(p.post||"")}</div>
    <h2 style="font-size:22px;margin:2px 0 6px">${esc(p.name||"")}</h2>
    <div class="row">
      <span class="chip turf">${esc(p.surface||"")}${p.distance?esc(p.distance)+"m":""}</span>
      <span class="chip">馬場 ${p.going?esc(p.going):"取得不可"}</span>
      ${p.cls?`<span class="chip">${esc(p.cls)}</span>`:""}<span class="chip">${n}頭</span>
      ${p.odds_mins!=null?`<span class="chip">${minsLabel(p.odds_mins)}のオッズ</span>`:`<span class="chip">オッズ 取得不可</span>`}
    </div>
    ${p.note?`<p class="note" style="margin-top:8px">${esc(p.note)}</p>`:""}
  </div>`;
  if(res){
    const t=res, rT=t.trio||{}, rX=t.tri||{};
    html += `<div class="card"><h2>結果 <span class="sub">記録の採点</span></h2>
      <div class="row" style="gap:6px;margin-bottom:8px">${top3.map((no,i)=>`<span class="small muted">${i+1}着</span>${W(no,n)}`).join("")}</div>
      <div class="small">3連複 ${t.trio_pay?yen(t.trio_pay):"—"} ／ 3連単 ${t.tri_pay?yen(t.tri_pay):"—"}</div>
      ${t.no_paper?`<p class="note" style="margin-top:6px">締切前の3連オッズが取れなかったため、記録の買い目はありません。</p>${p.ref?refBlock(p.ref):""}`:
      `<div class="small" style="margin-top:6px">記録した3連複 ${rT.pts||0}点 → <b class="${rT.ret?"neg":""}">${rT.ret?"的中 "+yen(rT.ret):"不的中"}</b> ／ 3連単 ${rX.pts||0}点 → <b class="${rX.ret?"neg":""}">${rX.ret?"的中 "+yen(rX.ret):"不的中"}</b></div>`}
    </div>`;
  }
  html += `<div class="card"><h2>出走馬 <span class="sub">AI勝率と人気（単勝オッズの確率）</span></h2>
    <div class="tw"><table><thead><tr><th></th><th>馬</th><th class="r">単勝</th><th class="r">AI勝率</th><th class="r">人気</th><th class="r">3着内</th><th>前走</th></tr></thead><tbody>
    ${horses.map(h=>{ const up = h.ai!=null && h.mkt!=null && h.ai/h.mkt>=1.3;
      return `<tr class="${top3.includes(h.no)?"hit":""}"><td class="mark">${esc(h.mark||"")}</td>
        <td><div class="row" style="gap:6px;flex-wrap:nowrap">${W(h.no,n,h.waku)}<div><div class="hn">${esc(h.name||"")}</div>
        <div class="small muted">${esc(h.jockey||"騎手 取得不可")} ${h.weight?esc(h.weight)+"kg":""} ${h.body?esc(h.body)+(h.body_diff!=null?`(${h.body_diff>0?"+":""}${esc(h.body_diff)})`:""):""}</div></div></div></td>
        <td class="r num">${h.odds?h.odds.toFixed(1):NA}</td>
        <td class="r num"><span class="${up?"up":""}">${pct(h.ai,1)}</span><div class="bar"><i style="width:${Math.min(100,(h.ai||0)*250)}%"></i></div></td>
        <td class="r num muted">${pct(h.mkt,1)}</td><td class="r num">${pct(h.ai3)}</td>
        <td class="small muted" style="white-space:nowrap">${(h.past||[]).filter(Boolean).slice(0,3).map(x=>esc(String(x).replace(/\s*着/,""))).join("・")||"—"}</td></tr>`; }).join("")}
    </tbody></table></div>
    <p class="note" style="margin-top:6px">緑の勝率は、AIが人気（単勝オッズ）より1.3倍以上高く見ている馬。</p></div>`;
  html += `<div class="card"><h2>3連複の候補 <span class="sub">期待値1.0以上・確率1%以上・10倍以上</span></h2>
    ${(p.trio||[]).length?comboTable(p.trio,"trio",hk):`<p class="muted" style="margin:0">このレースは条件に合う組がありません（買わないレース）。</p>`}
    ${p.ex_mins!=null?`<p class="note" style="margin-top:6px">${minsLabel(p.ex_mins)}の3連複・3連単オッズで計算。</p>`:`<p class="note" style="margin-top:6px">3連複・3連単のオッズは、発走30分前から取れます。</p>`}</div>`;
  html += `<div class="card"><h2>3連単の候補 <span class="sub">検証中・48点まで</span></h2>
    ${(p.tri||[]).length?comboTable(p.tri,"tri",hkt):`<p class="muted" style="margin:0">候補なし。</p>`}
    <p class="note" style="margin-top:6px">3連複の候補の3頭の並びのうち、3連単でも期待値1.0以上の組。過去の検証で数回の高配当頼みだったため、まだ採用していません。</p></div>`;
  if(p.paper){ html += `<div class="card"><h2>記録した買い目 <span class="sub">${minsLabel(p.paper.mins)}で固定${p.paper.late?"（5分前が取れず）":""}</span></h2>
    <div class="small">3連複 ${p.paper.trio.length}点：${p.paper.trio.map(x=>esc(x.c)).join("、")||"なし"}</div>
    <div class="small" style="margin-top:4px">3連単 ${p.paper.tri.length}点：${p.paper.tri.slice(0,12).map(x=>esc(x.c)).join("、")||"なし"}${p.paper.tri.length>12?" ほか":""}</div></div>`; }
  if((p.trio_top||[]).length) html += `<div class="card"><h2>参考：AIが当たりやすいと見る3連複 <span class="sub">買い目ではない</span></h2>${comboTable(p.trio_top,"trio",hk)}
    <p class="note" style="margin-top:6px">当たりやすい組でも、期待値が1.0未満ならオッズが割に合わないので候補にしません。</p></div>`;
  html += `<div class="row"><span class="small muted">${p.man!=null?`3連単1万円以上の確率 ${pct(p.man)}`:""} ${p.favout!=null?` ／ 1番人気（${esc(p.fav)}番）が3着以内に来ない確率 ${pct(p.favout)}`:""}</span></div>`;
  el.innerHTML = html;
}

/* ---------- 記録の成績 ---------- */
function renderRecord(){
  const el = $("#v-record");
  const rs = Object.values(REC?.races||{}).sort((a,b)=>(a.date+a.rid).localeCompare(b.date+b.rid));
  const sum = k => { let pts=0, ret=0, hit=0, races=0; rs.forEach(r=>{ const x=r[k]||{}; if(x.pts){ races++; pts+=x.pts; ret+=x.ret||0; if(x.ret) hit++; } }); return {pts,ret,hit,races,roi:pts?ret/(pts*100):null}; };
  const T=sum("trio"), X=sum("tri");
  let html = `<div class="banner">買っていない記録です。100円ずつ買ったとして、締切5分前のオッズで選んだ買い目を実際の払戻で採点しています。回収率の判断には数百レースが必要です（いま ${rs.length}レース）。</div>
  <div class="tiles">
    <div class="tile"><div class="k">3連複 回収率</div><div class="v ${T.roi>=1?"pos":T.roi!=null?"neg":""}">${T.roi!=null?pct(T.roi,1):"—"}</div><div class="small muted">${T.races}R・${T.pts}点・的中${T.hit}</div></div>
    <div class="tile"><div class="k">3連複 収支</div><div class="v ${T.ret-T.pts*100>=0?"pos":"neg"}" style="font-size:22px">${T.pts?yen(T.ret-T.pts*100):"—"}</div><div class="small muted">購入 ${yen(T.pts*100)}</div></div>
    <div class="tile"><div class="k">3連単（検証中） 回収率</div><div class="v ${X.roi>=1?"pos":X.roi!=null?"neg":""}">${X.roi!=null?pct(X.roi,1):"—"}</div><div class="small muted">${X.races}R・${X.pts}点・的中${X.hit}</div></div>
    <div class="tile"><div class="k">3連単 収支</div><div class="v ${X.ret-X.pts*100>=0?"pos":"neg"}" style="font-size:22px">${X.pts?yen(X.ret-X.pts*100):"—"}</div><div class="small muted">購入 ${yen(X.pts*100)}</div></div>
  </div>`;
  html += `<div class="card"><h2>回収率の推移 <span class="sub">記録を積み上げた累計</span></h2>${chart(rs)}</div>`;
  const byDate = {}; rs.forEach(r=>{ const d=byDate[r.date]=byDate[r.date]||{n:0,tp:0,tr:0,xp:0,xr:0}; d.n++; d.tp+=r.trio?.pts||0; d.tr+=r.trio?.ret||0; d.xp+=r.tri?.pts||0; d.xr+=r.tri?.ret||0; });
  html += `<div class="card"><h2>開催日ごと</h2>${Object.keys(byDate).length?`<div class="tw"><table><thead><tr><th>日付</th><th class="r">記録</th><th class="r">3連複</th><th class="r">回収率</th><th class="r">3連単</th><th class="r">回収率</th></tr></thead><tbody>
    ${Object.entries(byDate).reverse().map(([d,x])=>`<tr><td>${fmtDate(d)}（${wd(d)}）</td><td class="r num">${x.n}R</td><td class="r num">${x.tp}点</td><td class="r num">${x.tp?pct(x.tr/(x.tp*100)):"—"}</td><td class="r num">${x.xp}点</td><td class="r num">${x.xp?pct(x.xr/(x.xp*100)):"—"}</td></tr>`).join("")}
    </tbody></table></div>`:`<p class="muted" style="margin:0">まだ記録がありません。</p>`}</div>`;
  const hits = rs.filter(r=>(r.trio?.ret||0)+(r.tri?.ret||0)>0).reverse();
  html += `<div class="card"><h2>的中した記録</h2>${hits.length?hits.map(r=>`<div class="row" style="justify-content:space-between;border-top:1px solid var(--rule);padding:6px 0"><span>${fmtDate(r.date)} ${esc(r.venue||"")}${esc(r.rno||"")}R ${esc(r.name||"")}</span><span class="num">${r.trio?.ret?"3連複 "+yen(r.trio.ret):""} ${r.tri?.ret?"3連単 "+yen(r.tri.ret):""}</span></div>`).join(""):`<p class="muted" style="margin:0">まだありません。</p>`}</div>`;
  el.innerHTML = html;
}
function chart(rs){
  const pts=[]; let c1=0,r1=0,c2=0,r2=0;
  rs.forEach(r=>{ c1+=(r.trio?.pts||0)*100; r1+=r.trio?.ret||0; c2+=(r.tri?.pts||0)*100; r2+=r.tri?.ret||0; pts.push([c1?r1/c1:null,c2?r2/c2:null]); });
  if(pts.length<2) return `<p class="muted" style="margin:0">2レース以上たまると表示します。</p>`;
  const Wd=640,H=200,pl=40,pr=10,pt=10,pb=22;
  const vals=pts.flat().filter(v=>v!=null); const top=Math.max(1.5,Math.ceil(Math.max(...vals)*2)/2);
  const x=i=>pl+i*(Wd-pl-pr)/(pts.length-1), y=v=>pt+(top-v)/top*(H-pt-pb);
  let g=""; for(let v=0; v<=top+1e-9; v+=0.5){ g+=`<line x1="${pl}" x2="${Wd-pr}" y1="${y(v)}" y2="${y(v)}" stroke="${v===1?"var(--muted)":"var(--rule)"}" ${v===1?'stroke-dasharray="4 3"':""}/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v*100}%</text>`; }
  const line=(k,col)=>{ const d=pts.map((p,i)=>p[k]==null?null:`${x(i)},${y(p[k])}`).filter(Boolean); return d.length>1?`<polyline fill="none" stroke="${col}" stroke-width="2.2" points="${d.join(" ")}"/>`:""; };
  return `<svg viewBox="0 0 ${Wd} ${H}" width="100%" role="img" aria-label="回収率の推移">${g}${line(0,"var(--turf)")}${line(1,"var(--gold)")}
    <text x="${Wd-pr}" y="${H-6}" text-anchor="end">${pts.length}レース</text></svg>
    <div class="row small" style="gap:14px"><span><b style="color:var(--turf)">━</b> 3連複</span><span><b style="color:var(--gold)">━</b> 3連単（検証中）</span><span class="muted">点線＝100%</span></div>`;
}

/* ---------- しくみ ---------- */
function renderAbout(){
  const m = MODEL||{};
  $("#v-about").innerHTML = `<div class="card"><h2>しくみ</h2>
    <p style="margin:0 0 8px">JRA公式サイトの出馬表・オッズ・結果を自動で集め、AIが各馬の勝つ確率を出します。単勝の人気（オッズ）に、走破タイム・上がり3Fを馬場差で補正した指数などを足しています。</p>
    <p style="margin:0 0 8px">3連複・3連単は、実際のオッズとAIの確率を組み合わせて、各組が当たる確率を出します。<b>期待値</b>＝当たる確率×オッズ。1.0を超える組は、オッズが本当の当たりやすさより高い（割に合う）とAIが見ている組です。</p>
    <ul class="note" style="padding-left:18px;margin:0">
      <li>3連複の候補：期待値1.0以上・確率1%以上・10倍以上の組を全部（点数の上限なし）</li>
      <li>3連単の候補（検証中）：3連複の候補の3頭の並びのうち、3連単でも期待値1.0以上の組を48点まで</li>
      <li>記録：締切5分前のオッズで買い目を固定し、実際の払戻で採点（まだ賭けない）</li>
      <li>取得できない項目は推測で埋めず「取得不可」と表示</li>
    </ul></div>
  <div class="card"><h2>モデル</h2><div class="small">学習 ${esc(m.version||"")} ／ 期間 ${esc((m.train||[]).join("〜"))} ／ 勝ち馬 ${esc(m.races_win||"")}R・3連 ${esc(m.races_exotic||"")}R</div>
    <p class="note" style="margin-top:6px">過去の検証（確定オッズ）では3連複の回収率が100%を超えましたが、締切前のオッズでも同じになるかは、この記録で確かめている途中です。</p></div>
  <div class="card"><button class="btn" id="logout">この端末の鍵を消す</button></div>`;
  $("#logout").onclick = () => { LS.del("k"); location.reload(); };
}

/* ---------- タブ ---------- */
function render(){ ({today:renderToday, race:renderRace, record:renderRecord, about:renderAbout})[tab](); }
function show(t){ tab=t; document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+t)); render(); window.scrollTo(0,0); }
$("#tabs").addEventListener("click", e => { const b=e.target.closest("button"); if(b) show(b.dataset.tab); });
document.addEventListener("click", e => { const r=e.target.closest("[data-rid]"); if(r){ RID=r.dataset.rid; show("race"); } });

$("#lock").hidden = true;
unlock();
})();
</script>
